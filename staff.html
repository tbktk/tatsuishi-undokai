<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <meta name="theme-color" content="#f7f5ef" />
  <title>役員用｜立石地区 選手集合確認</title>
  <style>
    :root{--bg:#f7f5ef;--surface:#fff;--ink:#1f2933;--muted:#69757f;--line:#dedbd1;--accent:#2f6b4f;--warm:#f2eadb;--danger:#a23b3b;--shadow:0 10px 30px rgba(31,41,51,.06);--radius:18px}
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic",Meiryo,sans-serif;line-height:1.65}
    button,input{font:inherit}.wrap{width:min(760px,calc(100% - 32px));margin:0 auto}header{padding:32px 0 18px}
    h1{margin:0;font-size:clamp(1.7rem,5.8vw,2.55rem);line-height:1.25;letter-spacing:-.02em}
    .meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 0 0;color:var(--muted);font-size:.95rem}
    .panel{margin:12px 0 28px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;box-shadow:var(--shadow)}
    .panel strong{display:block;margin-bottom:6px;color:var(--accent)}.lock-note{margin:0;color:var(--muted);font-size:.9rem}
    .unlock-row{display:flex;gap:10px;margin-top:14px}.unlock-row input{min-width:0;flex:1;padding:13px 14px;border:1px solid #cfcac0;border-radius:12px;background:#fff}
    .primary{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;color:#fff;background:var(--accent)}
    .message{min-height:1.5em;margin:10px 0 0;font-size:.9rem;color:var(--muted)}.message.error{color:var(--danger)}
    
    .score-legend{display:inline-flex;align-items:center;gap:7px;margin:0 0 10px;color:var(--muted);font-size:.86rem}
    .score-legend::before{content:"";width:14px;height:14px;flex:0 0 14px;background:#fff7df;border:1px solid #d9b85f;border-radius:4px}
    .section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 14px}.section-title h2{margin:0;font-size:1.22rem}.section-title span{color:var(--muted);font-size:.86rem}
    .schedule{display:grid;gap:10px}
    details.event{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    details.event.scored{background:#fff7df;border-color:#d9b85f}details.event[open]{box-shadow:0 12px 34px rgba(31,41,51,.09)}
    summary.event-summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:start;padding:16px 17px}
    summary.event-summary::-webkit-details-marker{display:none}.time{color:var(--accent);font-size:1.05rem;font-weight:800;letter-spacing:.01em;white-space:nowrap}.scored .time{color:#8a6212}
    .event-main h3{margin:0;font-size:1rem;line-height:1.45}.event-main p{margin:6px 0 0;color:var(--muted);font-size:.9rem;line-height:1.55}
    .number{display:inline-block;margin-right:.45em;color:var(--muted);font-size:.78rem;font-weight:700;vertical-align:.08em}
    .attendance{display:inline-block;margin-top:7px;color:var(--accent);font-size:.82rem;font-weight:700}
    .players{border-top:1px solid rgba(222,219,209,.95);padding:8px 14px 14px;background:rgba(255,255,255,.6)}.scored .players{background:rgba(255,255,255,.45)}
    .player{display:flex;align-items:center;gap:11px;padding:11px 5px;border-bottom:1px solid #ece9e1;cursor:pointer}.player:last-child{border-bottom:0}.player-heading{padding:12px 5px 6px;font-weight:800;color:var(--ink)}
    .player input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--accent)}.player-name{font-weight:700}.player.checked span{color:var(--muted);text-decoration:line-through}
    .break{margin:14px 0 2px;padding:14px 18px;background:var(--warm);border-radius:14px;text-align:center;font-weight:700}
    .expand-hint{display:inline-flex;align-items:center;gap:6px;margin-top:7px;color:var(--accent);font-size:.82rem;font-weight:700}.expand-hint::after{content:"⌄";font-size:1rem;line-height:1;transition:transform .18s ease}.event[open] .expand-hint::after{transform:rotate(180deg)}.event-static{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:start;padding:16px 17px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.event-static.scored{background:#fff7df;border-color:#d9b85f}.event-static.scored .time{color:#8a6212}.hidden{display:none!important}
    @media(max-width:520px){.wrap{width:min(100% - 22px,760px)}header{padding-top:24px}.unlock-row{flex-direction:column}summary.event-summary,.event-static{grid-template-columns:68px 1fr;gap:10px;padding:14px}.time{font-size:1rem}.panel{padding:16px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>立石地区 選手集合確認</h1>
      <div class="meta"><span>2026年10月4日（日）</span><span>総社小学校</span><span>役員用</span></div>
    </header>
    <main>
      <section id="unlockPanel" class="panel">
        <strong>役員用ページを開く</strong>
        <p class="lock-note">共有された合言葉を入力してください。合言葉はこのページやGitHubには保存されません。</p>
        <form id="unlockForm" class="unlock-row">
          <input id="password" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="合言葉" aria-label="合言葉" required />
          <button class="primary" type="submit">選手一覧を表示</button>
        </form>
        <p id="unlockMessage" class="message" aria-live="polite"></p>
      </section>

      <section id="staffApp" class="hidden">
        <div class="score-legend">色付きの競技は採点競技です</div>

        <div class="section-title"><h2>午前の部</h2><span>8:15〜</span></div>
        <section id="morningList" class="schedule" aria-label="午前の競技"></section>

        <div class="break">昼休み　11:30〜12:15</div>

        <div class="section-title"><h2>午後の部</h2><span>12:15〜</span></div>
        <section id="afternoonList" class="schedule" aria-label="午後の競技"></section>
      </section>
    </main>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL="https://jovnslkxgdnlfiqkfwfl.supabase.co";
    const SUPABASE_KEY="sb_publishable_osr7gCLGgtnoN_aQECtHIA_sJW6diww";
    const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    let sessionPassword="";

    const EVENTS=[
      {no:1,time:"8:15",title:"開会式",info:"全員",part:"morning"},
      {no:2,time:"8:30",title:"ラジオ体操",info:"全員",part:"morning"},
      {no:3,time:"8:40",title:"遊戯",info:"3園合同",part:"morning"},
      {no:4,time:"9:00",title:"スピード玉入れ<br>総社 vs 勝山 対抗戦",info:"勝山・総社小児童",part:"morning"},
      {no:5,time:"9:25",title:"親子電車",info:"10組以内・幼児と保護者",part:"morning"},
      {no:6,time:"9:50",title:"ソフトバレー送りリレー",info:"30歳以上4人（男女各2人）／40歳以上6人（男女各3人）",part:"morning",scored:true},
      {no:7,time:"10:15",title:"台風の目",info:"小学生 男女15人（3人1組）",part:"morning"},
      {no:8,time:"10:40",title:"インディアカ入りリレー",info:"18歳以上女子6人",part:"morning",scored:true},
      {no:9,time:"11:05",title:"シルバー玉入れ競争",info:"60歳以上 男女15人",part:"morning",scored:true},
      {no:10,time:"11:30",title:"年齢別リレー（予選）",info:"7人（男性4人・女性3人）",part:"morning",scored:true},
      {no:11,time:"12:15",title:"お菓子GETだぜ！<br>待ってて自治会長",info:"",part:"afternoon"},
      {no:12,time:"12:30",title:"助っ人綱引き",info:"20人（男性10人・女性10人）",part:"afternoon",scored:true},
      {no:13,time:"12:55",title:"ボール蹴りリレー",info:"4人（年齢・性別不問）",part:"afternoon",scored:true},
      {no:14,time:"13:20",title:"子供長縄跳び競争",info:"12人（小学生男女）",part:"afternoon",scored:true},
      {no:15,time:"13:45",title:"ソフトボールリレー",info:"10代以上1人／20代以上1人／30代以上1人／40代以上2人／男女不問5人",part:"afternoon",scored:true},
      {no:16,time:"14:05",title:"紅白玉入れ",info:"20人（男性10人・女性10人）",part:"afternoon",scored:true},
      {no:17,time:"14:30",title:"年齢別リレー（決勝）",info:"予選参照",part:"afternoon",scored:true},
      {no:18,time:"15:00",title:"閉会式",info:"全員",part:"afternoon"}
    ];

    const STORAGE_KEY="tatsuishi-undokai-attendance-v1";
    let decrypted=null;
    let checked=loadChecks();

    function loadChecks(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch{return{}}}
    function saveChecks(){localStorage.setItem(STORAGE_KEY,JSON.stringify(checked))}
    function b64ToBytes(value){const binary=atob(value);return Uint8Array.from(binary,c=>c.charCodeAt(0))}
    async function decryptPayload(payload,password){
      const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);
      const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64ToBytes(payload.salt),iterations:payload.iterations,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);
      const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(payload.iv)},key,b64ToBytes(payload.data));
      return JSON.parse(new TextDecoder().decode(plain));
    }
    function keyFor(no,index,label){return no+":"+index+":"+label}

    function renderPlayerLabel(container,label,eventNo){
      const appendText=text=>container.appendChild(document.createTextNode(text));
      const appendName=name=>{
        const strong=document.createElement("span");
        strong.className="player-name";
        strong.textContent=name;
        container.appendChild(strong);
      };

      if(eventNo===5){
        appendName(label);
        return;
      }

      const roleSuffix="（自治会役員）";
      let suffix="";
      if(label.endsWith(roleSuffix)){
        label=label.slice(0,-roleSuffix.length);
        suffix=roleSuffix;
      }

      const prefixed=label.match(/^((?:[①②③④⑤⑥⑦][^：]*|(?:10|20|30|40)代以上)[:：]\s*)(.+)$/);
      if(prefixed){
        appendText(prefixed[1]);
        appendName(prefixed[2]);
      }else{
        const paren=label.match(/^（(.+)）$/);
        if(paren){
          appendText("（");
          appendName(paren[1]);
          appendText("）");
        }else{
          appendName(label);
        }
      }

      if(suffix){
        appendText(suffix);
      }
    }
    function countsFor(event){
      const competition=decrypted?.competitions?.[String(event.no)]||{unit:"名",items:[]};
      const items=competition.items||[];
      const players=items.filter(item=>item.type==="player");
      const done=players.reduce((n,item,i)=>n+(checked[keyFor(event.no,i,item.label)]?1:0),0);
      return{competition,items,players,done};
    }

    function localKeyForRemote(eventNo,playerKey){
      const event=EVENTS.find(item=>item.no===Number(eventNo));
      if(!event)return null;
      const {players}=countsFor(event);
      const index=Number(playerKey);
      const player=players[index];
      return player ? keyFor(event.no,index,player.label) : null;
    }

    function applyRemoteRow(row){
      const localKey=localKeyForRemote(row.event_no,row.player_key);
      if(!localKey)return;
      if(row.checked)checked[localKey]=true;else delete checked[localKey];
      saveChecks();

      const input=document.querySelector('input[data-event-no="'+row.event_no+'"][data-player-key="'+row.player_key+'"]');
      if(input){
        input.checked=!!row.checked;
        input.closest(".player")?.classList.toggle("checked",!!row.checked);
      }

      const event=EVENTS.find(item=>item.no===Number(row.event_no));
      const details=document.querySelector('details[data-event-no="'+row.event_no+'"]');
      const attendance=details?.querySelector(".attendance");
      if(event&&attendance){
        const fresh=countsFor(event);
        attendance.textContent=fresh.done+" / "+fresh.players.length+" "+fresh.competition.unit+" 集合";
      }
    }

    async function loadRemoteAttendance(){
      const {data,error}=await db.from("tatsuishi_attendance").select("event_no,player_key,checked");
      if(error)throw error;

      checked={};
      for(const row of data||[]){
        const localKey=localKeyForRemote(row.event_no,row.player_key);
        if(localKey&&row.checked)checked[localKey]=true;
      }
      saveChecks();
    }

    function startAttendanceRealtime(){
      db.channel("tatsuishi-attendance")
        .on("postgres_changes",
          {event:"*",schema:"public",table:"tatsuishi_attendance"},
          payload=>{
            if(payload.new)applyRemoteRow(payload.new);
          }
        )
        .subscribe();
    }

    async function saveRemoteAttendance(eventNo,playerKey,value){
      const {error}=await db.rpc("set_tatsuishi_attendance",{
        p_event_no:eventNo,
        p_player_key:String(playerKey),
        p_checked:value,
        p_password:sessionPassword
      });
      if(error)throw error;
    }
    function makeEvent(event){
      const {competition,items,players,done}=countsFor(event);

      if(event.no < 5 || event.no > 17){
        const article=document.createElement("article");
        article.className="event-static"+(event.scored?" scored":"");

        const time=document.createElement("div");
        time.className="time";
        time.textContent=event.time;

        const main=document.createElement("div");
        main.className="event-main";
        const h3=document.createElement("h3");
        h3.innerHTML='<span class="number">No.'+event.no+'</span>'+event.title;
        main.appendChild(h3);

        if(event.info){
          const p=document.createElement("p");
          p.textContent=event.info;
          main.appendChild(p);
        }

        article.append(time,main);
        return article;
      }

      const details=document.createElement("details");
      details.className="event"+(event.scored?" scored":"");
      details.dataset.eventNo=String(event.no);

      const summary=document.createElement("summary");
      summary.className="event-summary";

      const time=document.createElement("div");
      time.className="time";
      time.textContent=event.time;

      const main=document.createElement("div");
      main.className="event-main";
      const h3=document.createElement("h3");
      h3.innerHTML='<span class="number">No.'+event.no+'</span>'+event.title;
      main.appendChild(h3);

      if(event.info){
        const p=document.createElement("p");
        p.textContent=event.info;
        main.appendChild(p);
      }

      let attendance=null;
      if(players.length){
        attendance=document.createElement("span");
        attendance.className="attendance";
        attendance.textContent=done+" / "+players.length+" "+competition.unit+" 集合";
        main.appendChild(attendance);
      }

      const hint=document.createElement("span");
      hint.className="expand-hint";
      hint.textContent="選手一覧";
      main.appendChild(hint);

      summary.append(time,main);
      details.appendChild(summary);

      const playerList=document.createElement("div");
      playerList.className="players";

      if(!items.length){
        const empty=document.createElement("div");
        empty.style.padding="10px 5px 2px";
        empty.style.color="var(--muted)";
        empty.style.fontSize=".9rem";
        empty.textContent="選手はまだ登録されていません。";
        playerList.appendChild(empty);
      }else{
        let playerIndex=0;
        items.forEach(item=>{
          if(item.type==="heading"){
            const heading=document.createElement("div");
            heading.className="player-heading";
            heading.textContent=item.label;
            playerList.appendChild(heading);
            return;
          }

          const index=playerIndex++;
          const k=keyFor(event.no,index,item.label);
          const label=document.createElement("label");
          label.className="player"+(checked[k]?" checked":"");

          const input=document.createElement("input");
          input.type="checkbox";
          input.checked=!!checked[k];
          input.dataset.eventNo=String(event.no);
          input.dataset.playerKey=String(index);

          const span=document.createElement("span");
          renderPlayerLabel(span,item.label,event.no);

          input.addEventListener("change",async()=>{
            const next=input.checked;

            if(!next){
              const ok=confirm("この選手の集合チェックを解除しますか？");
              if(!ok){
                input.checked=true;
                return;
              }
            }

            if(next)checked[k]=true;else delete checked[k];
            saveChecks();
            label.classList.toggle("checked",next);
            let fresh=countsFor(event);
            if(attendance)attendance.textContent=fresh.done+" / "+fresh.players.length+" "+fresh.competition.unit+" 集合";

            input.disabled=true;
            try{
              await saveRemoteAttendance(event.no,index,next);
            }catch(error){
              input.checked=!next;
              if(!next)checked[k]=true;else delete checked[k];
              saveChecks();
              label.classList.toggle("checked",!next);
              fresh=countsFor(event);
              if(attendance)attendance.textContent=fresh.done+" / "+fresh.players.length+" "+fresh.competition.unit+" 集合";
              alert("出欠状態を同期できませんでした。通信状態を確認してもう一度お試しください。");
            }finally{
              input.disabled=false;
            }
          });

          label.append(input,span);
          playerList.appendChild(label);
        });
      }

      details.appendChild(playerList);
      return details;
    }
    function render(){
      const morning=document.getElementById("morningList");
      const afternoon=document.getElementById("afternoonList");
      morning.innerHTML="";afternoon.innerHTML="";
      for(const event of EVENTS)(event.part==="morning"?morning:afternoon).appendChild(makeEvent(event));
    }

    document.getElementById("unlockForm").addEventListener("submit",async e=>{
      e.preventDefault();
      const message=document.getElementById("unlockMessage");
      const password=document.getElementById("password").value;
      message.className="message";
      message.textContent="確認しています…";
      try{
        const response=await fetch("./players.enc.json",{cache:"no-store"});
        if(!response.ok)throw new Error("data");
        decrypted=await decryptPayload(await response.json(),password);
        sessionPassword=password;
        await loadRemoteAttendance();
        document.getElementById("password").value="";
        document.getElementById("unlockPanel").classList.add("hidden");
        document.getElementById("staffApp").classList.remove("hidden");
        render();
        startAttendanceRealtime();
      }catch{
        message.className="message error";
        message.textContent="合言葉が違うか、選手データを読み込めませんでした。";
      }
    });
  </script>
</body>
</html>
