<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f5ef" />
  <title>令和8年度 総社地区市民運動会 採点表</title>
  <meta name="description" content="令和8年度 総社地区市民運動会の採点表です。" />
  <style>
    :root {
      --bg: #f7f5ef;
      --surface: #fff;
      --ink: #1f2933;
      --muted: #69757f;
      --line: #d9d6cc;
      --accent: #2f6b4f;
      --accent-soft: #eaf3ee;
      --score: #fff7df;
      --score-line: #d9b85f;
      --rank: #eef4ff;
      --total: #edf7f1;
      --shadow: 0 10px 30px rgba(31, 41, 51, .06);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
        "Hiragino Sans", "Yu Gothic", "YuGothic", Meiryo, sans-serif;
      line-height: 1.55;
    }
    .wrap {
      width: min(1500px, calc(100% - 24px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }
    header {
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 4vw, 2.3rem);
      line-height: 1.25;
    }
    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: .92rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      color: var(--accent);
      font-size: .92rem;
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
    .note {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: .88rem;
    }
    .table-shell {
      overflow: auto;
      max-height: calc(100vh - 230px);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    table {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-variant-numeric: tabular-nums;
    }
    th, td {
      min-width: 112px;
      height: 58px;
      padding: 8px 10px;
      text-align: center;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      white-space: nowrap;
    }
    th:first-child,
    td:first-child {
      position: sticky;
      left: 0;
      z-index: 4;
      min-width: 190px;
      width: 190px;
      text-align: left;
      font-weight: 700;
      box-shadow: 2px 0 0 rgba(0,0,0,.04);
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #f2f0ea;
      font-weight: 800;
    }
    thead th:first-child {
      z-index: 7;
      background: #ebe8df;
    }
    tbody tr.rank-row th,
    tbody tr.rank-row td {
      position: sticky;
      top: 58px;
      z-index: 3;
      background: var(--rank);
      font-weight: 800;
    }
    tbody tr.total-row th,
    tbody tr.total-row td {
      position: sticky;
      top: 116px;
      z-index: 3;
      background: var(--total);
      font-weight: 800;
    }
    tbody tr.rank-row th:first-child,
    tbody tr.total-row th:first-child {
      z-index: 6;
    }
    tbody tr.event-row th {
      background: var(--score);
      border-left: 4px solid var(--score-line);
    }
    .event-name {
      display: block;
      white-space: normal;
      line-height: 1.25;
    }
    .event-meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 600;
    }
    .rank {
      font-size: 1.08rem;
    }
    .rank.first { color: #9a6b00; }
    .rank.second { color: #59636d; }
    .rank.third { color: #8a4f2b; }
    .total {
      color: var(--accent);
      font-size: 1.06rem;
    }
    .updated {
      margin-top: 10px;
      color: var(--muted);
      font-size: .82rem;
    }
    .empty-note {
      color: var(--muted);
      font-size: .8rem;
    }
    @media (max-width: 640px) {
      .wrap { width: min(100% - 12px, 1500px); padding-top: 18px; }
      .table-shell { max-height: calc(100vh - 200px); border-radius: 10px; }
      th, td { min-width: 96px; padding: 7px 6px; }
      th:first-child, td:first-child { min-width: 155px; width: 155px; }
      input.score { width: 66px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>令和8年度 総社地区市民運動会 採点表</h1>
      <div class="meta">2026年10月4日（日）・総社小学校</div>
      <a class="back-link" href="./">← 運動会プログラムを見る</a>
    </header>

    <p class="note">
      得点は運営側で随時更新します。順位と合計得点は自動計算されます。
    </p>

    <div class="table-shell" id="tableShell">
      <table id="scoreTable" aria-label="総社地区市民運動会 採点表"></table>
    </div>

  </div>

  <script>
    (() => {
      const regions = [
        "桜が丘", "新田", "立石", "植野", "高井", "城川",
        "巣烏", "鍛冶町", "粟島", "大屋敷", "山王"
      ];

      const events = [
        { no: 6, time: "9:50", name: "ソフトバレー送りリレー" },
        { no: 8, time: "10:40", name: "インディアカ入りリレー" },
        { no: 9, time: "11:05", name: "シルバー玉入れ競争" },
        { no: 10, time: "11:30", name: "年齢別リレー（予選）" },
        { no: 12, time: "12:30", name: "助っ人綱引き" },
        { no: 13, time: "12:55", name: "ボール蹴りリレー" },
        { no: 14, time: "13:20", name: "子供長縄跳び競争" },
        { no: 15, time: "13:45", name: "ソフトボールリレー" },
        { no: 16, time: "14:05", name: "紅白玉入れ" },
        { no: 17, time: "14:30", name: "年齢別リレー（決勝）" }
      ];

      // 得点はここを更新して反映します。
      // 例: 6: { "立石": 10, "高井": 8 }
      const scores = {};

      const columnOrder = [...regions];
      const table = document.getElementById("scoreTable");

      const getScore = (eventNo, region) => {
        const value = scores?.[eventNo]?.[region];
        return typeof value === "number" && Number.isFinite(value) ? value : null;
      };

      const totals = () => Object.fromEntries(regions.map(region => {
        const entered = events
          .map(event => getScore(event.no, region))
          .filter(value => value !== null);
        if (entered.length === 0) return [region, null];
        return [region, entered.reduce((sum, value) => sum + value, 0)];
      }));

      const ranks = (totalMap) => {
        const ranked = regions
          .filter(region => totalMap[region] !== null)
          .map(region => ({ region, total: totalMap[region] }))
          .sort((a, b) => b.total - a.total || regions.indexOf(a.region) - regions.indexOf(b.region));

        const result = Object.fromEntries(regions.map(region => [region, null]));
        let lastTotal = null;
        let lastRank = 0;

        ranked.forEach((item, i) => {
          if (lastTotal === null || item.total !== lastTotal) {
            lastRank = i + 1;
            lastTotal = item.total;
          }
          result[item.region] = lastRank;
        });
        return result;
      };

      const rankClass = rank =>
        rank === 1 ? "first" : rank === 2 ? "second" : rank === 3 ? "third" : "";

      function render() {
        const totalMap = totals();
        const rankMap = ranks(totalMap);

        const thead = `
          <thead>
            <tr>
              <th scope="col">競技</th>
              ${columnOrder.map(region => `<th scope="col">${region}</th>`).join("")}
            </tr>
          </thead>
        `;

        const rankRow = `
          <tr class="rank-row">
            <th scope="row">順位</th>
            ${columnOrder.map(region => {
              const rank = rankMap[region];
              return `<td><span class="rank ${rankClass(rank)}">${rank ? rank + "位" : "—"}</span></td>`;
            }).join("")}
          </tr>
        `;

        const totalRow = `
          <tr class="total-row">
            <th scope="row">合計得点</th>
            ${columnOrder.map(region => {
              const total = totalMap[region];
              return `<td><span class="total">${total === null ? "—" : total}</span></td>`;
            }).join("")}
          </tr>
        `;

        const eventRows = events.map(event => `
          <tr class="event-row">
            <th scope="row">
              <span class="event-name">No.${event.no} ${event.name}</span>
              <span class="event-meta">${event.time}</span>
            </th>
            ${columnOrder.map(region => {
              const value = getScore(event.no, region);
              return `<td>${value === null ? '<span class="empty-note">—</span>' : value}</td>`;
            }).join("")}
          </tr>
        `).join("");

        table.innerHTML = thead + `<tbody>${rankRow}${totalRow}${eventRows}</tbody>`;
      }

      render();
    })();
  </script>
</body>
</html>
