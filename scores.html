<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f5ef" />
  <title>令和8年度 総社地区市民運動会 採点表</title>
  <meta name="description" content="令和8年度 総社地区市民運動会の採点表です。" />
  <style>
    :root {
      --bg: #f7f5ef;
      --surface: #fff;
      --ink: #1f2933;
      --muted: #69757f;
      --line: #d9d6cc;
      --accent: #2f6b4f;
      --accent-soft: #eaf3ee;
      --score: #fff7df;
      --score-line: #d9b85f;
      --rank: #eef4ff;
      --total: #edf7f1;
      --shadow: 0 10px 30px rgba(31, 41, 51, .06);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
        "Hiragino Sans", "Yu Gothic", "YuGothic", Meiryo, sans-serif;
      line-height: 1.55;
    }
    .wrap {
      width: min(1500px, calc(100% - 24px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }
    header {
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 4vw, 2.3rem);
      line-height: 1.25;
    }
    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: .92rem;
    }
    .note {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: .88rem;
    }
    .table-shell {
      overflow: auto;
      max-height: calc(100vh - 230px);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    table {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-variant-numeric: tabular-nums;
    }
    th, td {
      min-width: 112px;
      height: 58px;
      padding: 8px 10px;
      text-align: center;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      white-space: nowrap;
    }
    th:first-child,
    td:first-child {
      position: sticky;
      left: 0;
      z-index: 4;
      min-width: 190px;
      width: 190px;
      text-align: left;
      font-weight: 700;
      box-shadow: 2px 0 0 rgba(0,0,0,.04);
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #f2f0ea;
      font-weight: 800;
    }
    thead th:first-child {
      z-index: 7;
      background: #ebe8df;
    }
    tbody tr.rank-row th,
    tbody tr.rank-row td {
      position: sticky;
      top: 58px;
      z-index: 3;
      background: var(--rank);
      font-weight: 800;
    }
    tbody tr.total-row th,
    tbody tr.total-row td {
      position: sticky;
      top: 116px;
      z-index: 3;
      background: var(--total);
      font-weight: 800;
    }
    tbody tr.rank-row th:first-child,
    tbody tr.total-row th:first-child {
      z-index: 6;
    }
    tbody tr.event-row th {
      background: var(--score);
      border-left: 4px solid var(--score-line);
    }
    .event-name {
      display: block;
      white-space: normal;
      line-height: 1.25;
    }
    .event-meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 600;
    }
    .rank {
      font-size: 1.08rem;
    }
    .rank.first { color: #9a6b00; }
    .rank.second { color: #59636d; }
    .rank.third { color: #8a4f2b; }
    .total {
      color: var(--accent);
      font-size: 1.06rem;
    }
    .updated {
      margin-top: 10px;
      color: var(--muted);
      font-size: .82rem;
    }
    .empty-note {
      color: var(--muted);
      font-size: .8rem;
    }
    @media (max-width: 640px) {
      .wrap { width: min(100% - 12px, 1500px); padding-top: 18px; }
      .table-shell { max-height: calc(100vh - 200px); border-radius: 10px; }
      th, td { min-width: 96px; padding: 7px 6px; }
      th:first-child, td:first-child { min-width: 155px; width: 155px; }
      input.score { width: 66px; }

      document.getElementById("sortRank").addEventListener("click", () => {
        const totalMap = totals();
        columnOrder = [...regions].sort((a, b) => {
          const aTotal = totalMap[a];
          const bTotal = totalMap[b];
          if (aTotal === null && bTotal === null) return regions.indexOf(a) - regions.indexOf(b);
          if (aTotal === null) return 1;
          if (bTotal === null) return -1;
          return bTotal - aTotal || regions.indexOf(a) - regions.indexOf(b);
        });
        render();
      });

      document.getElementById("resetOrder").addEventListener("click", () => {
        columnOrder = [...regions];
        render();
      });

      render();
    })();
  </script>
</body>
</html>
